name: Build Wasl APK
 
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار (مثال 1.0.0)"
        required: true
        default: "1.0.0"
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
 
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Prepare Capacitor shell
        run: |
          mkdir -p apk-shell/www apk-shell/assets
          cp public/icon-512.png apk-shell/assets/logo.png
          cp public/icon-512.png apk-shell/assets/logo-dark.png
          cd apk-shell
          cat > package.json <<'EOF'
          { "name": "wasl-apk-shell", "private": true, "version": "1.0.0" }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "ye.wasl.app",
            "appName": "وصل",
            "webDir": "www",
            "server": {
              "url": "https://baqala-connect-yemen.lovable.app",
              "cleartext": false
            },
            "android": {
              "allowMixedContent": false
            }
          }
          EOF
          printf '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>وصل</title></html>' > www/index.html
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3
          npx cap add android
 
      - name: Generate app icons and splash
        working-directory: apk-shell
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#111827' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#111827' || echo "assets generation skipped"
 
      - name: Add camera permission and set version
        working-directory: apk-shell
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' "$MANIFEST"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
 
      - name: Build release APK
        working-directory: apk-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
 
      - name: Sign APK
        working-directory: apk-shell
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > wasl-release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" wasl-aligned.apk
          "$BT/apksigner" sign \
            --ks wasl-release.keystore \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "Wasl-v${{ github.event.inputs.version_name }}.apk" \
            wasl-aligned.apk
          "$BT/apksigner" verify --print-certs "Wasl-v${{ github.event.inputs.version_name }}.apk"
          rm -f wasl-release.keystore
 
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wasl-APK-v${{ github.event.inputs.version_name }}
          path: apk-shell/Wasl-v*.apk
 
      - name: Publish GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.event.inputs.version_name }}-b${{ github.run_number }}
          name: "وصل — Wasl APK v${{ github.event.inputs.version_name }} (build ${{ github.run_number }})"
          body: |
            نسخة أندرويد جاهزة للتثبيت من تطبيق وصل.
            الإصدار: ${{ github.event.inputs.version_name }} — رقم البناء: ${{ github.run_number }}
            حمّل ملف الـ APK من المرفقات أدناه وأرسله عبر واتساب أو تيليجرام.
          files: apk-shell/Wasl-v*.apk
